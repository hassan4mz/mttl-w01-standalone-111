<!doctype html><html lang="en" data-theme="system"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MTTL-W01 Backend Log</title>
<script>(()=>{const m=document.cookie.match(/(?:^|;\s*)mttl_theme=([^;]+)/);const v=m?decodeURIComponent(m[1]):'system';document.documentElement.dataset.theme=['system','light','dark'].includes(v)?v:'system'})();</script>
<style>
:root{color-scheme:light;--bg:#f4f6f8;--card:#fff;--sub:#f0f3f6;--line:#d7dde5;--text:#17202b;--muted:#667386;--btn:#fff;--bad:#b42332;--warn:#8a5c00;--debug:#52657c}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;--bg:#10141b;--card:#181f2a;--sub:#202938;--line:#303a4d;--text:#eef2f8;--muted:#94a2b6;--btn:#273247;--bad:#ff9292;--warn:#ffd47a;--debug:#9bb3d2}}
:root[data-theme="dark"]{color-scheme:dark;--bg:#10141b;--card:#181f2a;--sub:#202938;--line:#303a4d;--text:#eef2f8;--muted:#94a2b6;--btn:#273247;--bad:#ff9292;--warn:#ffd47a;--debug:#9bb3d2}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",sans-serif}main{max-width:1600px;margin:auto;padding:18px}.top{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px}.actions,.filters{display:flex;gap:7px;align-items:center;flex-wrap:wrap}button,select{font:inherit;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--btn);color:var(--text)}button{cursor:pointer}.panel{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px}.filters{margin-bottom:10px}.muted{color:var(--muted)}.status{font-size:12px}.rows{font-family:ui-monospace,SFMono-Regular,Consolas,monospace;font-size:12px;display:grid;gap:4px}.row{display:grid;grid-template-columns:155px 65px 88px minmax(0,1fr);gap:7px;padding:6px 8px;border-radius:7px;background:var(--sub)}.row.ERROR{color:var(--bad)}.row.WARNING{color:var(--warn)}.row.DEBUG{color:var(--debug)}.msg{white-space:pre-wrap;overflow-wrap:anywhere}.json{white-space:pre-wrap;overflow:auto;margin:0;padding:8px;background:var(--sub);border-radius:8px;font-family:ui-monospace,SFMono-Regular,Consolas,monospace;font-size:12px;line-height:1.55;user-select:text}.selectable{cursor:text}.hidden{display:none}.cat{color:var(--muted)}@media(max-width:760px){.row{grid-template-columns:1fr}.time,.lvl,.cat{display:inline}.top{align-items:flex-start;flex-direction:column}}
</style></head><body><main>
<div class=top><div><h2 style="margin:0">Backend Log <span id=ver class=muted style="font-size:12px"></span></h2><div class="muted status">Last 5,000 lines in memory · DEBUG file: /data/logs/backend.log, up to 5 MB × 3 generations (current + 2 backups)</div></div><div class=actions><button onclick="location.href='/'">← Main</button><button onclick=clearLogs()>Clear buffer</button></div></div>
<div class=panel><div class=filters><label>Level <select id=level onchange=loadLogs()><option value=INFO selected>Brief INFO+</option><option value=DEBUG>Detailed DEBUG+</option><option value=WARNING>Warning WARNING+</option><option value=ERROR>Error ERROR</option></select></label><label>Category <select id=category onchange=loadLogs()><option value=all>All</option><option value=ota>OTA</option><option value=wire>Comms TX/RX</option><option value=control>Control</option><option value=childlock>Child Lock</option><option value=ha>Home Assistant</option><option value=connection>Connection</option><option value=storage>DB/backup</option><option value=other>Other</option></select></label><label>View <select id=view onchange=render()><option value=compact selected>Brief</option><option value=text>Text</option><option value=json>JSON</option></select></label><label>Rows <select id=limit onchange=loadLogs()><option>100</option><option selected>300</option><option>500</option><option>1000</option></select></label><label><input id=auto type=checkbox checked onchange=autoToggle()> Auto 2s</label><button onclick=loadLogs()>Refresh</button><button id=copyBtn onclick=copyLogs()>Copy current log</button><span id=status class="muted status"></span></div><div id=auth class="hidden" style="padding:18px">Administrator login required. <a href="/">Log in from the main screen</a>.</div><div id=rows class=rows></div><pre id=text class="json hidden selectable"></pre><pre id=json class="json hidden selectable"></pre></div>
<script src=/logs.js></script></main></body></html>
